name: PomPom
on:
  push:
  pull_request:
jobs:
  reachy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download bundled audio from Hugging Face
        run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux SDK build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libgirepository1.0-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check pompom tests
      - run: python -m build
      - run: python scripts/check-package.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pompom/static/main.js
