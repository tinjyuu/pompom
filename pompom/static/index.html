<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PomPom</title><link rel="icon" type="image/png" href="/static/icon.png"><link rel="stylesheet" href="/static/style.css"><script src="/static/main.js" defer></script></head>
<body><main>
<header><div><h1>PomPom</h1><p>小さな相棒。</p></div><img class="app-icon" src="/static/icon.png" width="88" height="88" alt="PomPom"></header>
<div id="error" role="alert" hidden></div>
<section class="session">
<div class="row"><h2>いっしょに過ごす</h2><span id="state" class="badge">接続中</span></div>
<div id="timer" aria-live="off">25:00</div><p id="detail"></p><p id="condition-status" class="muted" aria-live="polite"></p>
<div class="controls"><button data-action="free" id="free">無料で遊ぶ</button><button data-action="start" id="start" class="secondary">AIで見守る</button></div>
<p class="muted">無料モードは時間無制限・撮影なし。AI見守りはAPI料金がかかります。</p>
<label class="check"><input type="checkbox" id="consent">AI見守りで画像をOpenAIへ送ることに同意する</label>
<div class="controls"><button data-action="pause" id="pause" class="secondary" disabled>一時停止</button><button data-action="resume" id="resume" class="secondary" disabled>再開</button><button data-action="end" id="end" class="secondary" disabled>終了</button></div>
</section>
<div class="columns">
<section><h2>設定</h2><form id="settings">
<label class="check"><input type="checkbox" id="audio" checked>音を出す</label>
<label class="check"><input type="checkbox" id="idle-behavior" checked>気まぐれな仕草と鳴き声</label>
<label class="check"><input type="checkbox" id="voice" checked>検知したら話す</label>
<details><summary>AI見守りの設定</summary>
<fieldset id="condition-presets"><legend>反応する条件</legend><label class="check"><input type="checkbox" name="condition" value="phone" checked>スマホ</label><label class="check"><input type="checkbox" name="condition" value="slouch">猫背</label><label class="check"><input type="checkbox" name="condition" value="custom">自由入力</label></fieldset>
<p id="condition-hint" class="muted"></p>
<label id="custom-condition-label" hidden>反応してほしい状態<textarea id="custom-condition" maxlength="1000" rows="3" placeholder="例：顔の前で本を持っている"></textarea></label>
<label>APIキー <span id="key-status"></span><input id="api-key" type="password" autocomplete="new-password" placeholder="変更するときだけ入力"></label><button type="button" id="delete-key" class="text-button">キーを削除</button>
<label>見守る時間（分）<input id="minutes" type="number" min="1" max="240" value="25" required></label>
<label>送信間隔（秒）<input id="capture-interval" type="number" min="1" max="3600" value="60" required></label>
<p class="muted">変更するとAI見守りは終了します。</p>
</details>
<button class="secondary" type="submit">保存</button>
</form></section>
<section><h2>試す</h2><div class="controls"><button id="preview" class="secondary">カメラ</button><button id="test" class="secondary">声かけ</button></div>
<div class="preview" id="preview-box" hidden><img id="frame" alt="カメラの確認画像" hidden><p id="preview-placeholder" hidden></p></div>
</section></div>
<section><div class="row"><h2>記録</h2><span id="count">通知 0回</span></div><ol id="events"></ol><p class="muted">写真は直近20件。本体には保存しません。</p></section>
<section><h2>API料金</h2><p id="usage-cost" class="usage-cost">読み込み中…</p><p id="usage-cost-note" class="muted"></p>
<details><summary>使用量と計算の詳細</summary>
<p id="usage-summary"></p><p id="usage-tokens"></p><p id="usage-note" class="muted"></p>
<p class="muted">100万tokensあたり：入力 $0.10／キャッシュ読込 $0.01／書込 $0.125／出力 無料。<a href="https://developers.openai.com/api/docs/guides/decisions#pricing-and-availability" target="_blank" rel="noopener noreferrer">公式料金</a>（2026-11-05確認）</p>
</details></section>
<dialog id="event-photo-dialog"><div class="row"><p id="event-photo-caption"></p><button id="close-event-photo" class="secondary" type="button">閉じる</button></div><img id="event-photo-full" alt="判定時の写真"></dialog>
</main></body></html>
