[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pompom"
version = "0.1.0"
description = "A dancing focus companion for Reachy Mini, powered by direct OpenAI Decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reachy-mini>=1.12.0,<1.13", "httpx>=0.28,<1", "Pillow>=10,<14", "fastapi>=0.115,<1"]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
pompom = "pompom.main:Pompom"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pompom", "pompom.*"]
namespaces = false

[tool.setuptools.package-data]
pompom = ["static/*.html", "static/*.css", "static/*.js", "assets/*.wav"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
